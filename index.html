:root{--paper:#f3ead7;--paper2:#e9dcc0;--ink:#2a2320;--red:#c8553d;--green:#4f8a5b;--purple:#7b5ea7;--gold:#d9a441;--blue:#3f6e9a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#2a2320;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{font-family:Hand,'Patrick Hand','Chalkboard SE','Marker Felt',sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;max-width:500px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--ink);color:var(--paper);font-size:15px;min-height:46px}
#top .bar{position:relative;height:16px;border:2px solid var(--paper);border-radius:9px;overflow:hidden;background:#4a3f39;flex:1}
#top .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .3s}
#top .bar.xp i{background:var(--gold)}
#top .bar b{position:absolute;inset:0;text-align:center;font-weight:normal;font-size:12px;line-height:12px;color:#fff;text-shadow:0 1px 2px #000}
#top .gold{color:var(--gold);min-width:44px;text-align:right}
#top .lv{font-family:Brush,cursive;font-size:18px;min-width:36px}
.ib{background:none;border:2px solid var(--paper);color:var(--paper);border-radius:10px;width:38px;height:34px;font-family:Brush,cursive;font-size:15px;padding:0;flex:0 0 auto}
#cv{flex:1 1 auto;width:100%;min-height:0;display:block;touch-action:none}
#panel{flex:0 0 auto;padding:8px 8px 10px;background:var(--paper2);border-top:3px solid var(--ink);position:relative}
#panel:empty{display:none}
.btn{font-family:Hand,sans-serif;font-size:17px;color:var(--ink);background:#fffaf0;border:3px solid var(--ink);border-radius:12px 14px 11px 13px;padding:9px 10px;box-shadow:3px 3px 0 var(--ink);min-height:48px;line-height:1.1;position:relative;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.42;box-shadow:none}
.btn.big{font-family:Brush,cursive;font-size:24px;width:100%;margin:7px 0}
.btn.red{background:#f6d9cf}.btn.green{background:#d9ead9}.btn.purple{background:#e4dbf0}.btn.gold{background:#f6e6be}.btn.blue{background:#d6e3ef}
.btn small{display:block;font-size:12.5px;opacity:.8;margin-top:2px}
.btn .cost{position:absolute;top:-9px;right:-7px;background:var(--purple);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:22px;text-align:center;border:2px solid var(--ink)}
.btn .badge{position:absolute;top:-9px;right:-7px;background:var(--red);color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:14px;line-height:18px;text-align:center;border:2px solid var(--ink);padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid .btn{padding:6px 3px;font-size:15px;min-height:56px}
.row{display:flex;gap:8px;align-items:center}
.row>.btn{flex:1}
.energy{display:flex;gap:4px;align-items:center;font-family:Brush,cursive;font-size:18px}
.energy i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--purple);display:inline-block}
.energy i.off{background:transparent;opacity:.4}
.log{font-size:14px;min-height:20px;margin:0 2px 6px;color:#5a4d44;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ov{position:absolute;inset:0;display:none;z-index:20;background:rgba(42,35,32,.55);padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px);overflow-y:auto;-webkit-overflow-scrolling:touch}
#ov.on{display:block}
#ov.full{background:var(--paper)}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:16px 13px 17px 12px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:6px auto;max-width:470px;position:relative}
.card h2{font-family:Brush,cursive;font-weight:normal;font-size:30px;margin:0 0 6px;line-height:1}
.card h3{font-family:Brush,cursive;font-weight:normal;font-size:22px;margin:10px 0 4px}
.card p{font-size:18px;line-height:1.3;margin:6px 0 10px}
.card .res{background:#fffaf0;border:2px dashed var(--ink);border-radius:10px;padding:10px;font-size:17px;margin:8px 0}
.choice{display:block;width:100%;text-align:left;margin:8px 0}
.choice .req{font-family:Brush,cursive;margin-right:4px}
.tag{display:inline-block;padding:1px 7px;border:2px solid var(--ink);border-radius:8px;font-size:13px;margin:2px 2px 2px 0;background:#fffaf0}
.item{display:flex;gap:10px;align-items:center;border:2px solid var(--ink);border-radius:12px;padding:8px;margin:8px 0;background:#fffaf0}
.item .sw{width:40px;height:40px;border-radius:9px;border:2px solid var(--ink);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-family:Brush,cursive;font-size:20px;color:#fff}
.item .nm{font-size:17px;line-height:1.1}.item .st{font-size:14px;opacity:.85}
.item .q{font-size:13px;font-style:italic;opacity:.7}
.up{color:var(--green)}.dn{color:var(--red)}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tcol h3{text-align:center;margin:2px 0 6px;color:#fff;border-radius:9px;padding:3px 0;border:2px solid var(--ink)}
.sk{border:2.5px solid var(--ink);border-radius:11px;padding:6px 5px;margin-bottom:7px;background:#fffaf0;min-height:74px;font-size:14px;line-height:1.1;position:relative}
.sk.lock{opacity:.4}.sk.sel{outline:3px solid var(--gold);outline-offset:1px}
.sk .n{font-size:15.5px;display:block}.sk .ty{font-size:11.5px;opacity:.7}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{flex:1;height:7px;border:1.5px solid var(--ink);border-radius:3px}
.pips i.on{background:var(--ink)}
.title{text-align:center;padding-top:4vh}
.logo{font-family:Brush,cursive;font-size:68px;line-height:.9;margin:0;letter-spacing:1px;text-shadow:4px 3px 0 var(--purple)}
.sub{font-size:18px;margin:6px 0 4px;opacity:.85}
.small{font-size:14px;opacity:.75}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1.5px dashed #b9a98c;padding:5px 3px;text-align:left}th{font-family:Brush,cursive;font-weight:normal;font-size:17px}
#fan{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:30}
#fan .lv{font-family:Brush,cursive;font-size:64px;color:var(--gold);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);animation:pop 1.6s ease-out forwards;text-align:center;line-height:.9}
#fan .lv small{display:table;margin:8px auto 0;font-family:Hand,sans-serif;font-size:21px;color:#fff;-webkit-text-stroke:0;text-shadow:none;background:var(--ink);padding:3px 12px;border-radius:10px}

// ===== AUDIO =====
const AU={ctx:null,m:null,sfx:null,mus:null,muted:false,track:0,step:0,next:0,timer:null};
function auInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 try{AU.ctx=new C();}catch(e){return}
 const c=AU.ctx;AU.m=c.createGain();AU.m.gain.value=AU.muted?0:1;AU.m.connect(c.destination);
 AU.sfx=c.createGain();AU.sfx.gain.value=.55;AU.sfx.connect(AU.m);
 AU.mus=c.createGain();AU.mus.gain.value=.16;AU.mus.connect(AU.m);
 // tiny echo for music
 const d=c.createDelay();d.delayTime.value=.28;const fb=c.createGain();fb.gain.value=.3;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;
 AU.mus.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(AU.m);
 AU.next=c.currentTime+.1;AU.timer=setInterval(auTick,30);
}
function auMute(v){AU.muted=v;if(AU.m)AU.m.gain.setTargetAtTime(v?0:1,AU.ctx.currentTime,.02)}
function tone(f,dur,type,vol,slide,delay,dest){
 const c=AU.ctx;if(!c||AU.muted)return;const t=c.currentTime+(delay||0);
 const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.2,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol,freq,delay,dest,type){
 const c=AU.ctx;if(!c||AU.muted)return;const t=c.currentTime+(delay||0);
 const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||1200;const g=c.createGain();
 g.gain.setValueAtTime(vol||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(dest||AU.sfx);s.start(t);
}

// music: [roots], scale, bpm per track. track 0 title/map, 1-3 act combat, 4 boss
const MUS=[
 {bpm:84,ch:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],root:48,lead:.6},
 {bpm:104,ch:[[0,4,7],[5,9,12],[9,12,16],[7,11,14]],root:50,lead:.8,dr:1},
 {bpm:108,ch:[[0,3,7],[10,14,17],[8,12,15],[7,10,14]],root:50,lead:.8,dr:1},
 {bpm:96,ch:[[0,4,8],[2,6,10],[4,8,12],[6,10,14]],root:48,lead:.9,dr:1},
 {bpm:128,ch:[[0,3,7],[1,5,8],[0,3,7],[10,13,17]],root:45,lead:1,dr:2},
];
function musSet(i){AU.track=i}
function auTick(){
 const c=AU.ctx;if(!c)return;const M=MUS[AU.track]||MUS[0];const sp=60/M.bpm/2;
 while(AU.next<c.currentTime+.12){
  const st=AU.step,bar=Math.floor(st/8)%M.ch.length,ch=M.ch[bar],t=AU.next-c.currentTime;
  if(!AU.muted&&t>=0){
   const hz=n=>440*Math.pow(2,(n-69)/12);
   if(st%8===0)tone(hz(M.root-12+ch[0]),sp*7,'triangle',.5,0,t,AU.mus);
   if(st%8===4&&M.dr)tone(hz(M.root-12+ch[0]),sp*3,'triangle',.35,0,t,AU.mus);
   const k=(st*5+bar*3)%7;if(k<5*M.lead){const n=ch[(st+Math.floor(st/3))%3]+12*(st%4===3?1:0);tone(hz(M.root+12+n),sp*1.6,'square',.12,0,t,AU.mus)}
   if(M.dr){if(st%2===0)noise(.03,.12,7000,t,AU.mus,'highpass');if(st%8===4||(M.dr>1&&st%8===6))noise(.12,.25,1400,t,AU.mus);if(st%8===0)tone(110,.12,'sine',.6,45,t,AU.mus)}
  }
  AU.step++;AU.next+=sp;
 }
}

let BOIL=0;
function jit(k){const x=Math.sin(k*12.9898+BOIL*78.233)*43758.5453;return (x-Math.floor(x))-.5}
function inkPath(g,pts,closed,w,fill,j,col){
 j=j==null?1.6:j;
 if(fill){g.save();g.translate(3,2.5);g.globalAlpha=.85;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=fill;g.fill();g.restore()}
 g.beginPath();pts.forEach((p,i)=>{const x=p[0]+jit(i*3.1+p[0]*.7)*j,y=p[1]+jit(i*7.7+p[1]*.3)*j;i?g.lineTo(x,y):g.moveTo(x,y)});if(closed)g.closePath();
 g.lineWidth=w||3;g.strokeStyle=col||COL.ink;g.lineJoin='round';g.lineCap='round';g.stroke();
}
function ell(cx,cy,rx,ry,n,wob,seed){n=n||20;const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,k=1+(wob||0)*Math.sin(a*3+(seed||0));p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p}
function rr(x,y,w,h){return [[x,y],[x+w*.5,y-1],[x+w,y],[x+w+1,y+h*.5],[x+w,y+h],[x+w*.5,y+h+1],[x,y+h],[x-1,y+h*.5]]}
function line(g,x1,y1,x2,y2,w,col){inkPath(g,[[x1,y1],[(x1+x2)/2,(y1+y2)/2],[x2,y2]],false,w||3,null,1.4,col)}
function dot(g,x,y,r,col){g.beginPath();g.arc(x+jit(x)*.8,y+jit(y)*.8,r,0,7);g.fillStyle=col||COL.ink;g.fill()}
function eyes(g,x,y,n,s,look,blink){
 const sp=s*.32;for(let i=0;i<n;i++){const ex=x+(i-(n-1)/2)*sp,ey=y+(n>2&&i%2?-s*.08:0);
  if(blink){line(g,ex-s*.09,ey,ex+s*.09,ey,2.5);continue}
  inkPath(g,ell(ex,ey,s*.11,s*.13,12),true,2.5,'#fff',.8);dot(g,ex+(look||0)*s*.04,ey+s*.02,s*.05)}
}
function txt(g,s,x,y,size,col,align,font){g.font=(size||16)+'px '+(font||'Hand');g.textAlign=align||'center';g.textBaseline='middle';g.fillStyle=col||COL.ink;g.fillText(s,x,y)}
function txtO(g,s,x,y,size,col,oc,font){g.font=(size||16)+'px '+(font||'Brush');g.textAlign='center';g.textBaseline='middle';g.lineWidth=5;g.strokeStyle=oc||COL.paper;g.lineJoin='round';g.strokeText(s,x,y);g.fillStyle=col||COL.ink;g.fillText(s,x,y)}

 try{S.run=JSON.parse(localStorage.getItem(KEY_RUN)||'null')}catch(e){S.run=null}

 const s={maxHp:c.hp+(r.lvl-1)*4+5*K.b1+(r.bonusHp||0)+gsum(r,'hp'),atk:c.atk+Math.floor((r.lvl-1)/2)+(r.bonusAtk||0)+gsum(r,'atk'),
  def:c.def+Math.floor((r.lvl-1)/3)+gsum(r,'def'),crit:c.crit+5*K.c1+gsum(r,'crit'),dodge:Math.min(60,6*K.c3+gsum(r,'dodge')),

}

function gainXP(r,n){r.xp+=n;let up=0;while(r.xp>=need(r.lvl)){r.xp-=need(r.lvl);r.lvl++;r.sp++;r.pendingLv++;up++;r.hp+=4+8}fixHp(r);return up}

function mkItem(act,rar,slot,name){
 const lb=.06*(S.meta?S.meta.perks.luck:0);
 if(rar==null){const x=R();rar=x<.07+lb?2:x<.33+lb?1:0}
 slot=slot||pick(['weapon','armor','trinket']);let it={slot,rar};
 if(name&&slot==='trinket'){const t=TRK.find(t=>t.n===name);if(t)return mkTrk(act,rar,t)}
 if(slot==='weapon'){it.atk=act+rar+ri(0,1);if(rar>=1&&R()<.6)it.crit=3*rar+ri(0,2);if(rar>=2)it.sk=2+ri(0,2);it.name=name||((rar?pick(PRE[rar])+' ':'')+pick(WEAP));it.q=pick(['Pointy end goes toward the problem.','Has a little dent where someone tried.','Comes with no instructions.','Reviews: 4 stars.','Smells faintly of pencil shavings.'])}
 else if(slot==='armor'){it.def=act+rar+ri(0,1);it.hp=4*act+5*rar+ri(0,4);if(rar>=2)it.dodge=4;it.name=name||((rar?pick(PRE[rar])+' ':'')+pick(ARM));it.q=pick(['Fits like a suggestion.','Machine washable, unfortunately.','Someone drew pockets on it.','Rated for minor-to-moderate peril.'])}

function mkTrk(act,rar,t){const it={slot:'trinket',rar,name:(rar&&!t.epic?pick(PRE[rar])+' ':'')+t.n,q:t.q};

   else{const x=R()*100;t=x<40?'fight':x<62?'event':x<76?'mystery':x<87?(r>=2?'elite':'fight'):x<96?'shop':(r>=2&&r!==5?'rest':'event')}

 }
 if(!rows.slice(1,6).some(row=>row.some(n=>n.t==='shop'))){const row=rows[ri(2,4)];pick(row).t='shop'}

  A.forEach(a=>{let t=B.map((b,i)=>({i,d:Math.abs(b.c-a.c)})).filter(o=>o.d<=1).sort((p,q)=>p.d-q.d).slice(0,2);if(!t.length)t=[B.map((b,i)=>({i,d:Math.abs(b.c-a.c)})).sort((p,q)=>p.d-q.d)[0]];a.l=t.map(o=>o.i)});

 }

function calcScore(r,won){let s=r.nodes*10+r.kills*5+r.elites*25+r.bosses*100+r.lvl*10+Math.floor(r.gold/5)+(won?300:0)+r.corners*20;return Math.round(s*(1+.25*r.heat))}
function endingFor(r){if(r.corners>=3)return 'back';const f=topFac(r);return f||'none'}
function endRun(r,won){
 const M=S.meta;const ending=won?endingFor(r):'dead';const score=calcScore(r,won);const ink=Math.max(5,Math.floor(score/8));
 const rec={cls:r.cls,heat:r.heat,act:r.act,lvl:r.lvl,score,ending,won:won?1:0,kills:r.kills,date:Date.now(),mins:Math.round((r.play||0)/60),ranks:Object.assign({},r.ranks)};
 M.runs.unshift(rec);M.runs=M.runs.slice(0,40);M.ink+=ink;M.inkTotal+=ink;M.stats.runs++;if(won)M.stats.wins++;M.stats.best=Math.max(M.stats.best,score);
 const newEnd=!M.endings[ending];M.endings[ending]=(M.endings[ending]||0)+1;

 r.result={won,ending,score,ink,newEnd,heatUp,rank:M.runs.slice().sort((a,b)=>b.score-a.score).indexOf(rec)+1};
 r.scr='end';r.combat=null;r.pendingLv=0;r.newAct=0;
}

function lootHTML(){const r=S.run,L=r.loot;const t=L.from==='boss'?'Boss down!':L.from==='elite'?'Elite down!':L.from==='fight'?'Victory!':L.from==='treasure'?'Treasure!':'You got something';

cv.addEventListener('pointerdown',ev=>{auInit();const r=S.run;if(!r||UI.title||UI.ov)return;const b=cv.getBoundingClientRect(),x=ev.clientX-b.left,y=ev.clientY-b.top;tapAt(x,y)});
function tapAt(x,y){const r=S.run;
 if(r.scr==='map'&&!busy()){for(const [a,b] of reachable(r)){const n=r.map.rows[a][b],p=nodeXY(n);if(Math.hypot(p.x-x,p.y-y)<(n.t==='boss'?38:30)){sfx('select');r.path=r.path||[];r.path.push([a,b]);goNode(r,a,b);UI.dhp=r.hp;if(r.combat)UI.lastCombat=r.combat;render();return true}}}
 else if(r.scr==='combat'){const L=layout();let best=-1,bd=1e9;r.combat.en.forEach((e,i)=>{if(e.hp<=0)return;const P=L.e[i];const d=Math.hypot(P.x-x,(P.y-P.s*.4)-y);if(d<Math.max(60,P.s*.7)&&d<bd){bd=d;best=i}});if(best>=0&&best!==r.combat.tgt){r.combat.tgt=best;sfx('select');render();return true}}
 return false}
function auMusic(){if(!AU.ctx)return;const r=S.run;let tr=0;if(!UI.title&&r&&r.combat)tr=r.combat.kind==='boss'?4:r.act;musSet(tr)}
document.addEventListener('visibilitychange',()=>{if(AU.ctx){if(document.hidden)AU.ctx.suspend();else if(!AU.muted)AU.ctx.resume()}save()});

// ===== BOT (used by automated tests & balance sim) =====
function botSkill(r,br){const ks=SKIDS.filter(k=>SK[k].br===br&&canRank(r,k)).sort((a,b)=>SK[b].tier-SK[a].tier);
 let k=ks.find(k=>r.ranks[k]<3)||ks[0];if(!k){k=SKIDS.filter(k=>canRank(r,k)).sort((a,b)=>SK[b].tier-SK[a].tier)[0]}return k}
function botDecide(st){
 const r=S.run,M=S.meta;const B=b=>({b,fn:()=>botDo(b)});
 if(UI.title||!r){
  if(UI.ov==='cls'){if(UI.clsSel!==st.cls&&M.cls[st.cls])return B('cls-'+st.cls);return B('begin')}
  if(UI.ov==='table'){if(!M.cls[st.cls]&&M.ink>=CL[st.cls].cost)return B('unlock-'+st.cls);return B('back')}
  if(UI.ov)return B('back');
  if(!M.cls[st.cls]&&M.ink>=CL[st.cls].cost)return B('table');
  return B('new');
 }
 if(UI.ov==='menu')return B('resume');if(UI.ov==='gear')return B('close');
 if(UI.ov==='skills'){if(r.sp>0){const k=botSkill(r,st.br);if(k){if(UI.sel!==k)return B('sk-'+k);return B('rank')}}return B('close')}
 const s=stats(r);
 if(r.scr==='map'){if(r.sp>0&&botSkill(r,st.br))return B('skills');
  const hpR=r.hp/s.maxHp;let best=null,bs=-1;
  for(const [a,b] of reachable(r)){const n=r.map.rows[a][b];const t=n.t;let v={fight:3,elite:st.path==='fight'?(hpR>.65?5:0):(hpR>.85?2:0),event:st.path==='safe'?4.5:3,mystery:3,shop:r.gold>=90?4.5:1,rest:hpR<.5?7:1.5,treasure:5,boss:10}[t];v+=R()*1.5;if(v>bs){bs=v;best=n}}
  const p=nodeXY(best);return {x:p.x,y:p.y,fn:()=>{tapAt(p.x,p.y)}};
 }
 if(r.scr==='combat'){const c=r.combat,al=alive(c);if(!al.length)return {wait:1};
  const tg=al.slice().sort((a,b)=>a.hp-b.hp)[0],ti=c.en.indexOf(tg);
  if(c.tgt!==ti){const L=layout(),P=L.e[ti];return {x:P.x,y:P.y-P.s*.4,fn:()=>{c.tgt=ti}}}
  const inc=incoming(r)-c.block,hpR=r.hp/s.maxHp;
  const pi=n=>r.pots.indexOf(n);
  if(pi('tonic')>=0&&hpR<.35)return B('pot-'+pi('tonic'));
  if(pi('thunder')>=0&&(al.length>=2||c.kind!=='fight'))return B('pot-'+pi('thunder'));
  if(pi('tea')>=0&&c.kind!=='fight'&&c.turn<=2)return B('pot-'+pi('tea'));
  const can=k=>r.ranks[k]>0&&c.energy>=ACT[k].cost||(k==='strike'||k==='guard')&&c.energy>=1;
  if(can('w2')&&r.ranks.w2>0&&hpR<.5)return B('act-w2');
  if(c.bgT!==c.turn){c.bgT=c.turn;c.bg=0}
  if(can('guard')&&inc>0&&c.bg<2&&(inc>=r.hp*.35||r.hp<inc+12)){c.bg++;return B('act-guard')}
  if(can('c4')&&tg.st.weak===0&&incoming(r)>=10)return B('act-c4');
  if(can('b4'))return B('act-b4');
  if(can('b2')&&al.length>=2)return B('act-b2');
  const dmg=['strike','c2','w1'].filter(can).map(k=>({k,v:ACT[k].val(r,s)*(k==='w1'&&tg.b>0?1.4:1)+(k==='c2'&&tg.hp>25?3+r.ranks.c2:0)})).sort((a,b)=>b.v-a.v);
  if(dmg.length)return B('act-'+dmg[0].k);
  if(pi('fizz')>=0&&c.energy===0&&al.length)return B('pot-'+pi('fizz'));
  return B('end');
 }
 if(r.scr==='event'){if(r.ev.res)return B('cont');const e=EVS.find(x=>x.id===r.ev.id);let bi=0,bs=-99;
  e.ch.forEach((c,i)=>{if(!reqOk(r,c.req))return;const f=c.fx.toString();let v=1+R()*.6;if(/^Leave/.test(c.t))v=.2;
   if(st.fac&&(f.includes("swear(r,'"+st.fac+"')")||f.includes("rep(r,'"+st.fac+"'")))v+=4;if(st.fac&&/swear\(r,'(\w+)'/.test(f)&&!f.includes("'"+st.fac+"'"))v-=5;
   if(st.corners&&f.includes('corners++'))v+=5;if(!st.fac&&r.ev.id==='crossroads'&&i===3)v+=3;if(f.includes('hurt(')&&r.hp/s.maxHp<.4)v-=3;if(f.includes('pendingFight')&&r.hp/s.maxHp<.6)v-=3;if(f.includes('heal(r')&&r.hp/s.maxHp<.5)v+=2;if(f.includes('r.sp'))v+=1;
   if(v>bs){bs=v;bi=i}});return B('ch-'+bi)}
 if(r.scr==='shop'){const sh=r.shop;for(let i=0;i<sh.items.length;i++){const o=sh.items[i];if(sh.sold[i])continue;const p=price(r,o.p);if(r.gold<p)continue;
   if(o.k==='heal'&&r.hp/s.maxHp<.5)return B('buy-'+i);if(o.k==='item'&&power(o.it)>power(r.gear[o.it.slot])+6)return B('buy-'+i);
   if(o.k==='tutor'&&r.gold-p>=20)return B('buy-'+i);if(o.k==='pot'&&r.pots.length<2)return B('buy-'+i)}return B('leave')}
 if(r.scr==='rest')return B(r.hp/s.maxHp<.6?'nap':(R()<.3?'sharpen':'practice'));
 if(r.scr==='restdone')return B('cont');
 if(r.scr==='loot'){const L=r.loot;for(let i=0;i<L.items.length;i++)if(!L.done[i])return B(power(L.items[i])>power(r.gear[L.items[i].slot])?'equip-'+i:'sell-'+i);return B('cont')}
 if(r.scr==='end')return B('title');
 return {wait:1};
}
function botDo(b){const r=S.run,[k,a]=b.split(/-(.+)/);
 switch(k){case 'cls':UI.clsSel=a;break;case 'begin':beginRun();break;case 'unlock':buyMeta('cls',a);break;case 'back':case 'resume':case 'close':UI.ov=null;break;
  case 'table':UI.ov='table';break;case 'new':UI.ov='cls';break;case 'sk':UI.sel=a;break;case 'rank':rankUp(r,UI.sel);break;case 'skills':UI.ov='skills';break;
  case 'pot':usePot(r,+a);break;case 'act':useAct(r,a);break;case 'end':endTurn(r);break;
  case 'cont':if(r.scr==='event')evContinue(r);else if(r.scr==='loot')lootContinue(r);else r.scr='map';break;
  case 'ch':chooseEv(r,+a);break;case 'buy':shopBuy(r,+a);break;case 'leave':r.scr='map';r.shop=null;break;
  case 'nap':case 'practice':case 'sharpen':restDo(r,k);break;case 'equip':lootTake(r,+a,'equip');break;case 'sell':lootTake(r,+a,'sell');break;
  case 'title':S.run=null;UI.title=true;break}}
// headless balance sim: runs the same bot through pure logic, no saving, no FX
function sim(n,st){const bk={m:JSON.stringify(S.meta),r:JSON.stringify(S.run),t:UI.title,ov:UI.ov,fx:FX,spd:SPD,sv:save};
 const out=[];FX={float(){},flash(){},shake(){},hp(){},lunge(){},sound(){},busy(){}};save=()=>{};const rd=render;render=()=>{};SPD=0;
 try{for(let i=0;i<n;i++){S.run=newRun(st.cls||'surveyor',st.heat||0);S.run.path=[];UI.title=false;UI.ov=null;let k=0;
  let lastC=null;while(S.run.scr!=='end'&&k++<6000){if(S.run.combat)lastC=S.run.combat;const d=botDecide(st);if(d.wait)break;if(k>5995&&S.run.combat){const c=S.run.combat;const e0=c.energy;d.fn();console.log('STUCK-DBG',d.b,e0,'->',c.energy,S.run.combat===c,c.tgt,JSON.stringify(c.en.map(e=>e.hp)),S.run.scr,c.won)}else d.fn()}
  if(k>=6000)console.log('STUCK',S.run.scr,JSON.stringify(botDecide(st)),S.run.combat&&JSON.stringify(S.run.combat.en.map(e=>[e.n,e.hp,e.it])),S.run.combat&&S.run.combat.energy);
  out.push({won:S.run.result&&S.run.result.won,act:S.run.act,lvl:S.run.lvl,end:S.run.result&&S.run.result.ending,score:S.run.result&&S.run.result.score,turns:S.run.turns,nodes:S.run.nodes,steps:k,killer:S.run.result&&!S.run.result.won&&lastC?lastC.kind+':'+lastC.en.map(e=>e.id).join('+'):''})}}
 finally{S.meta=JSON.parse(bk.m);S.run=JSON.parse(bk.r);UI.title=bk.t;UI.ov=bk.ov;FX=bk.fx;SPD=bk.spd;save=bk.sv;render=rd;render()}
 return out}
window.PR={S,BAL,botDo,UI,botDecide,sim,stats,layout,nodeXY,tapAt,setSpeed:v=>SPD=v,busy,get run(){return S.run},actLabel};

loadAll();AU.muted=!!S.meta.mute;
document.addEventListener('touchend',()=>auInit(),{passive:true});document.addEventListener('click',()=>auInit());
document.fonts&&document.fonts.ready.then(()=>render());
render();requestAnimationFrame(loop);
